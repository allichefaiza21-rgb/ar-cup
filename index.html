<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>متجر فايزة للواقع المعزز ✨</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui { position: fixed; z-index: 100; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; }
        button { padding: 15px 40px; background: #e91e63; color: white; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui"><button id="startBtn">إبدأ التجربة السحرية 📸</button></div>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind.txt;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets><video id="arVideo" src="./video.mp4" loop="true" crossorigin="anonymous" playsinline></video></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0"><a-video src="#arVideo" width="1" height="0.6"></a-video></a-entity>
    </a-scene>
    <script>
        const btn = document.querySelector('#startBtn');
        const video = document.querySelector('#arVideo');
        btn.addEventListener('click', () => { video.play(); video.pause(); document.querySelector('#ui').style.display = 'none'; });
        const target = document.querySelector('a-entity');
        target.addEventListener("targetFound", () => video.play());
        target.addEventListener("targetLost", () => video.pause());
    </script>
</body>
</html>
